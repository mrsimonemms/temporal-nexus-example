[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orders"
version = "0.1.0"
description = "Orders service for the Temporal Nexus workshop demo"
requires-python = ">=3.10"
dependencies = [
  "nexus-rpc==1.5.0",
  "temporalio==1.36.0",
]

[project.optional-dependencies]
dev = [
  "watchfiles==1.3.0",
]

[project.scripts]
orders-worker = "orders.worker:main"
