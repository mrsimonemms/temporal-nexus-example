services:
  inventory:
    build:
      context: ./services/inventory
      target: builder
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-inventory}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
    volumes:
      - ./services/inventory:/go/app
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 10s
      retries: 3

  orders:
    build:
      context: ./services/orders
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-orders}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
    volumes:
      - ./services/orders:/app
    depends_on:
      temporal:
        condition: service_healthy

  temporal:
    image: temporalio/temporal
    ports:
      - 7233:7233
      - 8233:8233
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - inventory
      - --namespace
      - orders
      - --db-filename
      - /data/temporal.db
    volumes:
      - temporal_data:/data
    post_start:
      - command:
          - /bin/sh
          - -ec
          - |
            until temporal operator cluster health; do
              sleep 1
            done

            if temporal operator nexus endpoint get --name inventory; then
              temporal operator nexus endpoint update \
                --name inventory \
                --target-namespace inventory \
                --target-task-queue Inventory
            else
              temporal operator nexus endpoint create \
                --name inventory \
                --target-namespace inventory \
                --target-task-queue Inventory
            fi
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - image: alpine
        command:
          - chown
          - -R
          - 1000:1000
          - /data

volumes:
  temporal_data:
